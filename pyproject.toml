[project]
name = "meu-braco-direito-platform"
version = "0.1.0"
description = "Meu Braço Direito: content platform, API and durable Python workflows."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pyjwt[crypto]>=2.10,<3",
  "temporalio>=1.10,<2",
  "argon2-cffi>=25,<26",
  "email-validator>=2,<3",
  "pyotp>=2.9,<3",
  "stripe>=14,<15",
  "httpx>=0.28,<1",
  "boto3>=1.40,<2",
  "pillow>=12,<13",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = [
  "integration: requires a migrated PostgreSQL database",
  "temporal: requires the Temporal test server",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["app/tests"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
