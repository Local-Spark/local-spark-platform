name: local-spark-platform
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-spark-admin-password
      POSTGRES_DB: local_spark_platform
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - local-spark-postgres:/var/lib/postgresql/data
      - ./docker/postgres/001-local-users.sql:/docker-entrypoint-initdb.d/001-local-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d local_spark_platform"]
      interval: 2s
      timeout: 3s
      retries: 20
  temporal:
    image: temporalio/temporal:1.4.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/var/lib/temporal/temporal.db"]
    volumes:
      - local-spark-temporal:/var/lib/temporal
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
  api:
    build: .
    environment:
      LOCAL_SPARK_DATABASE_URL: postgresql+asyncpg://local_spark_runtime:local-spark-app-password@postgres:5432/local_spark_platform
      LOCAL_SPARK_JWT_SECRET: development-local-spark-change-this-secret-before-deploying
      LOCAL_SPARK_AUTH_DATABASE_URL: postgresql+asyncpg://local_spark_identity:local-spark-auth-password@postgres:5432/local_spark_platform
      LOCAL_SPARK_BILLING_DATABASE_URL: postgresql+asyncpg://local_spark_payments:local-spark-billing-password@postgres:5432/local_spark_platform
      LOCAL_SPARK_BILLING_MODE: ${LOCAL_SPARK_BILLING_MODE:-disabled}
      LOCAL_SPARK_PUBLIC_WEB_URL: ${LOCAL_SPARK_PUBLIC_WEB_URL:-http://localhost:5173}
      LOCAL_SPARK_STRIPE_SECRET_KEY: ${LOCAL_SPARK_STRIPE_SECRET_KEY:-}
      LOCAL_SPARK_STRIPE_WEBHOOK_SECRET: ${LOCAL_SPARK_STRIPE_WEBHOOK_SECRET:-}
      LOCAL_SPARK_STRIPE_PRICE_ID: ${LOCAL_SPARK_STRIPE_PRICE_ID:-}
      LOCAL_SPARK_BILLING_MONTHLY_AMOUNT_MINOR: ${LOCAL_SPARK_BILLING_MONTHLY_AMOUNT_MINOR:-}
    ports: ["127.0.0.1:${LOCAL_SPARK_API_PORT:-8000}:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "-m", "app.entrypoints.worker"]
    environment:
      LOCAL_SPARK_DATABASE_URL: postgresql+asyncpg://local_spark_runtime:local-spark-app-password@postgres:5432/local_spark_platform
      LOCAL_SPARK_JWT_SECRET: development-local-spark-change-this-secret-before-deploying
      LOCAL_SPARK_TEMPORAL_ADDRESS: temporal:7233
    profiles: ["workers"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
  relay:
    build: .
    command: ["python", "-m", "app.entrypoints.relay"]
    environment:
      LOCAL_SPARK_DATABASE_URL: postgresql+asyncpg://local_spark_runtime:local-spark-app-password@postgres:5432/local_spark_platform
      LOCAL_SPARK_RELAY_DATABASE_URL: postgresql+asyncpg://local_spark_delivery:local-spark-relay-password@postgres:5432/local_spark_platform
      LOCAL_SPARK_JWT_SECRET: development-local-spark-change-this-secret-before-deploying
      LOCAL_SPARK_TEMPORAL_ADDRESS: temporal:7233
    profiles: ["workers"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
  billing:
    build: .
    command: ["python", "-m", "app.entrypoints.billing"]
    environment:
      LOCAL_SPARK_DATABASE_URL: postgresql+asyncpg://local_spark_payments:local-spark-billing-password@postgres:5432/local_spark_platform
      LOCAL_SPARK_BILLING_DATABASE_URL: postgresql+asyncpg://local_spark_payments:local-spark-billing-password@postgres:5432/local_spark_platform
      LOCAL_SPARK_JWT_SECRET: development-local-spark-change-this-secret-before-deploying
      LOCAL_SPARK_TEMPORAL_ADDRESS: temporal:7233
      LOCAL_SPARK_BILLING_MODE: ${LOCAL_SPARK_BILLING_MODE:-disabled}
      LOCAL_SPARK_PUBLIC_WEB_URL: ${LOCAL_SPARK_PUBLIC_WEB_URL:-http://localhost:5173}
      LOCAL_SPARK_STRIPE_SECRET_KEY: ${LOCAL_SPARK_STRIPE_SECRET_KEY:-}
      LOCAL_SPARK_STRIPE_WEBHOOK_SECRET: ${LOCAL_SPARK_STRIPE_WEBHOOK_SECRET:-}
      LOCAL_SPARK_STRIPE_PRICE_ID: ${LOCAL_SPARK_STRIPE_PRICE_ID:-}
      LOCAL_SPARK_BILLING_MONTHLY_AMOUNT_MINOR: ${LOCAL_SPARK_BILLING_MONTHLY_AMOUNT_MINOR:-}
    profiles: ["workers"]
    restart: on-failure
    depends_on: [postgres, temporal]
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:11025:1025"]
  auth-mail:
    build: .
    command: ["python", "-m", "app.entrypoints.auth_mail"]
    environment:
      LOCAL_SPARK_DATABASE_URL: postgresql+asyncpg://local_spark_identity:local-spark-auth-password@postgres:5432/local_spark_platform
      LOCAL_SPARK_AUTH_DATABASE_URL: postgresql+asyncpg://local_spark_identity:local-spark-auth-password@postgres:5432/local_spark_platform
      LOCAL_SPARK_JWT_SECRET: development-local-spark-change-this-secret-before-deploying
      LOCAL_SPARK_SMTP_HOST: mailpit
      LOCAL_SPARK_SMTP_PORT: 1025
    profiles: ["workers"]
    restart: on-failure
    depends_on: [postgres, mailpit]

volumes:
  local-spark-postgres:
  local-spark-temporal:
  # Legacy identity volume retained without a service; never delete user data during migration.
  local-spark-keycloak:
