name: meu-braco-direito-platform
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: meu-braco-direito-admin-password
      POSTGRES_DB: meu_braco_direito_platform
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - meu-braco-direito-postgres:/var/lib/postgresql/data
      - ./docker/postgres/001-local-users.sql:/docker-entrypoint-initdb.d/001-local-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meu_braco_direito_platform"]
      interval: 2s
      timeout: 3s
      retries: 20
  temporal:
    image: temporalio/temporal:1.4.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/var/lib/temporal/temporal.db"]
    volumes:
      - meu-braco-direito-temporal:/var/lib/temporal
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
  object-storage:
    image: chrislusf/seaweedfs:4.39
    environment:
      AWS_ACCESS_KEY_ID: meu-braco-direito-local
      AWS_SECRET_ACCESS_KEY: meu-braco-direito-local-secret
      S3_BUCKET: meu-braco-direito-materials
    ports: ["127.0.0.1:9000:8333"]
    volumes: ["meu-braco-direito-materials:/data"]
    profiles: ["workers"]
  api:
    build: .
    environment:
      MEU_BRACO_DIREITO_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_runtime:meu-braco-direito-app-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_JWT_SECRET: development-meu-braco-direito-change-this-secret-before-deploying
      MEU_BRACO_DIREITO_AUTH_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_identity:meu-braco-direito-auth-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_BILLING_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_payments:meu-braco-direito-billing-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_BILLING_MODE: ${MEU_BRACO_DIREITO_BILLING_MODE:-disabled}
      MEU_BRACO_DIREITO_PUBLIC_WEB_URL: ${MEU_BRACO_DIREITO_PUBLIC_WEB_URL:-http://localhost:5173}
      MEU_BRACO_DIREITO_STRIPE_SECRET_KEY: ${MEU_BRACO_DIREITO_STRIPE_SECRET_KEY:-}
      MEU_BRACO_DIREITO_STRIPE_WEBHOOK_SECRET: ${MEU_BRACO_DIREITO_STRIPE_WEBHOOK_SECRET:-}
      MEU_BRACO_DIREITO_STRIPE_PRICE_ID: ${MEU_BRACO_DIREITO_STRIPE_PRICE_ID:-}
      MEU_BRACO_DIREITO_BILLING_MONTHLY_AMOUNT_MINOR: ${MEU_BRACO_DIREITO_BILLING_MONTHLY_AMOUNT_MINOR:-}
      MEU_BRACO_DIREITO_PHONE_VERIFY_MODE: ${MEU_BRACO_DIREITO_PHONE_VERIFY_MODE:-disabled}
      MEU_BRACO_DIREITO_PHONE_VERIFY_CHANNEL: ${MEU_BRACO_DIREITO_PHONE_VERIFY_CHANNEL:-sms}
      MEU_BRACO_DIREITO_TWILIO_VERIFY_SERVICE_SID: ${MEU_BRACO_DIREITO_TWILIO_VERIFY_SERVICE_SID:-}
      MEU_BRACO_DIREITO_TWILIO_API_KEY: ${MEU_BRACO_DIREITO_TWILIO_API_KEY:-}
      MEU_BRACO_DIREITO_TWILIO_API_SECRET: ${MEU_BRACO_DIREITO_TWILIO_API_SECRET:-}
      MEU_BRACO_DIREITO_META_WEBHOOK_MODE: ${MEU_BRACO_DIREITO_META_WEBHOOK_MODE:-disabled}
      MEU_BRACO_DIREITO_META_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_ingest:meu-braco-direito-meta-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_META_VERIFY_TOKEN: ${MEU_BRACO_DIREITO_META_VERIFY_TOKEN:-}
      MEU_BRACO_DIREITO_META_APP_SECRET: ${MEU_BRACO_DIREITO_META_APP_SECRET:-}
      MEU_BRACO_DIREITO_META_WABA_ID: ${MEU_BRACO_DIREITO_META_WABA_ID:-}
      MEU_BRACO_DIREITO_META_PHONE_NUMBER_ID: ${MEU_BRACO_DIREITO_META_PHONE_NUMBER_ID:-}
      MEU_BRACO_DIREITO_META_PUBLIC_PHONE: ${MEU_BRACO_DIREITO_META_PUBLIC_PHONE:-}
      MEU_BRACO_DIREITO_META_ENCRYPTION_KEY: ${MEU_BRACO_DIREITO_META_ENCRYPTION_KEY:-}
      MEU_BRACO_DIREITO_OPENAI_API_KEY: ${MEU_BRACO_DIREITO_OPENAI_API_KEY:-}
      MEU_BRACO_DIREITO_SERVICE_AGREEMENT_REQUIRED: ${MEU_BRACO_DIREITO_SERVICE_AGREEMENT_REQUIRED:-false}
      MEU_BRACO_DIREITO_VISUAL_AI_MODE: ${MEU_BRACO_DIREITO_VISUAL_AI_MODE:-disabled}
      MEU_BRACO_DIREITO_VISUAL_AI_EXECUTION_ENABLED: ${MEU_BRACO_DIREITO_VISUAL_AI_EXECUTION_ENABLED:-false}
      MEU_BRACO_DIREITO_VISUAL_AI_RESERVATION_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_RESERVATION_USD_MICROS:-0}
      MEU_BRACO_DIREITO_VISUAL_AI_MONTHLY_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_MONTHLY_BUDGET_USD_MICROS:-0}
      MEU_BRACO_DIREITO_VISUAL_AI_GLOBAL_MONTHLY_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_GLOBAL_MONTHLY_BUDGET_USD_MICROS:-0}
      MEU_BRACO_DIREITO_EDITORIAL_AI_MODE: ${MEU_BRACO_DIREITO_EDITORIAL_AI_MODE:-disabled}
      MEU_BRACO_DIREITO_EDITORIAL_AI_MODEL: ${MEU_BRACO_DIREITO_EDITORIAL_AI_MODEL:-gpt-5-mini}
      MEU_BRACO_DIREITO_EDITORIAL_CREATIVE_EXPERIMENTAL: ${MEU_BRACO_DIREITO_EDITORIAL_CREATIVE_EXPERIMENTAL:-false}
      MEU_BRACO_DIREITO_EDITORIAL_DAILY_TOKEN_LIMIT: ${MEU_BRACO_DIREITO_EDITORIAL_DAILY_TOKEN_LIMIT:-0}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      MEU_BRACO_DIREITO_INTENT_AI_MODE: ${MEU_BRACO_DIREITO_INTENT_AI_MODE:-disabled}
      MEU_BRACO_DIREITO_INTENT_AI_DAILY_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_INTENT_AI_DAILY_BUDGET_USD_MICROS:-0}
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_BUCKET: meu-braco-direito-materials
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_ENDPOINT: http://object-storage:8333
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_ACCESS_KEY: meu-braco-direito-local
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_SECRET_KEY: meu-braco-direito-local-secret
    ports: ["127.0.0.1:${MEU_BRACO_DIREITO_API_PORT:-8000}:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: .
      target: media-worker
    command: ["python", "-m", "app.entrypoints.worker"]
    environment:
      MEU_BRACO_DIREITO_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_runtime:meu-braco-direito-app-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_JWT_SECRET: development-meu-braco-direito-change-this-secret-before-deploying
      MEU_BRACO_DIREITO_TEMPORAL_ADDRESS: temporal:7233
      MEU_BRACO_DIREITO_CORRELATOR_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_router:meu-braco-direito-router-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_META_ENCRYPTION_KEY: ${MEU_BRACO_DIREITO_META_ENCRYPTION_KEY:-}
      MEU_BRACO_DIREITO_META_PHONE_NUMBER_ID: ${MEU_BRACO_DIREITO_META_PHONE_NUMBER_ID:-}
      MEU_BRACO_DIREITO_META_ACCESS_TOKEN: ${MEU_BRACO_DIREITO_META_ACCESS_TOKEN:-}
      MEU_BRACO_DIREITO_META_GRAPH_VERSION: ${MEU_BRACO_DIREITO_META_GRAPH_VERSION:-}
      MEU_BRACO_DIREITO_AUDIO_TRANSCRIPTION_MODE: ${MEU_BRACO_DIREITO_AUDIO_TRANSCRIPTION_MODE:-disabled}
      MEU_BRACO_DIREITO_OPENAI_API_KEY: ${MEU_BRACO_DIREITO_OPENAI_API_KEY:-}
      MEU_BRACO_DIREITO_SERVICE_AGREEMENT_REQUIRED: ${MEU_BRACO_DIREITO_SERVICE_AGREEMENT_REQUIRED:-false}
      MEU_BRACO_DIREITO_VISUAL_AI_MODE: ${MEU_BRACO_DIREITO_VISUAL_AI_MODE:-disabled}
      MEU_BRACO_DIREITO_VISUAL_AI_EXECUTION_ENABLED: ${MEU_BRACO_DIREITO_VISUAL_AI_EXECUTION_ENABLED:-false}
      MEU_BRACO_DIREITO_VISUAL_AI_RESERVATION_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_RESERVATION_USD_MICROS:-0}
      MEU_BRACO_DIREITO_VISUAL_AI_MONTHLY_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_MONTHLY_BUDGET_USD_MICROS:-0}
      MEU_BRACO_DIREITO_VISUAL_AI_GLOBAL_MONTHLY_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_GLOBAL_MONTHLY_BUDGET_USD_MICROS:-0}
      MEU_BRACO_DIREITO_AUDIO_DAILY_SECONDS_LIMIT: ${MEU_BRACO_DIREITO_AUDIO_DAILY_SECONDS_LIMIT:-0}
      MEU_BRACO_DIREITO_EDITORIAL_AI_MODE: ${MEU_BRACO_DIREITO_EDITORIAL_AI_MODE:-disabled}
      MEU_BRACO_DIREITO_EDITORIAL_AI_MODEL: ${MEU_BRACO_DIREITO_EDITORIAL_AI_MODEL:-gpt-5-mini}
      MEU_BRACO_DIREITO_EDITORIAL_CREATIVE_EXPERIMENTAL: ${MEU_BRACO_DIREITO_EDITORIAL_CREATIVE_EXPERIMENTAL:-false}
      MEU_BRACO_DIREITO_EDITORIAL_DAILY_TOKEN_LIMIT: ${MEU_BRACO_DIREITO_EDITORIAL_DAILY_TOKEN_LIMIT:-0}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      MEU_BRACO_DIREITO_INTENT_AI_MODE: ${MEU_BRACO_DIREITO_INTENT_AI_MODE:-disabled}
      MEU_BRACO_DIREITO_INTENT_AI_DAILY_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_INTENT_AI_DAILY_BUDGET_USD_MICROS:-0}
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_BUCKET: meu-braco-direito-materials
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_ENDPOINT: http://object-storage:8333
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_ACCESS_KEY: meu-braco-direito-local
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_SECRET_KEY: meu-braco-direito-local-secret
    profiles: ["workers"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      object-storage:
        condition: service_started
  whatsapp-correlator:
    build: .
    command: ["python", "-m", "app.entrypoints.whatsapp_correlator"]
    environment:
      MEU_BRACO_DIREITO_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_router:meu-braco-direito-router-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_CORRELATOR_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_router:meu-braco-direito-router-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_JWT_SECRET: development-meu-braco-direito-change-this-secret-before-deploying
      MEU_BRACO_DIREITO_META_ENCRYPTION_KEY: ${MEU_BRACO_DIREITO_META_ENCRYPTION_KEY:-}
    profiles: ["workers"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
  whatsapp-dispatcher:
    build: .
    command: ["python", "-m", "app.entrypoints.whatsapp_dispatcher"]
    environment:
      MEU_BRACO_DIREITO_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_router:meu-braco-direito-router-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_CORRELATOR_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_router:meu-braco-direito-router-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_JWT_SECRET: development-meu-braco-direito-change-this-secret-before-deploying
      MEU_BRACO_DIREITO_META_ENCRYPTION_KEY: ${MEU_BRACO_DIREITO_META_ENCRYPTION_KEY:-}
      MEU_BRACO_DIREITO_OPENAI_API_KEY: ${MEU_BRACO_DIREITO_OPENAI_API_KEY:-}
      MEU_BRACO_DIREITO_SERVICE_AGREEMENT_REQUIRED: ${MEU_BRACO_DIREITO_SERVICE_AGREEMENT_REQUIRED:-false}
      MEU_BRACO_DIREITO_VISUAL_AI_MODE: ${MEU_BRACO_DIREITO_VISUAL_AI_MODE:-disabled}
      MEU_BRACO_DIREITO_VISUAL_AI_EXECUTION_ENABLED: ${MEU_BRACO_DIREITO_VISUAL_AI_EXECUTION_ENABLED:-false}
      MEU_BRACO_DIREITO_VISUAL_AI_RESERVATION_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_RESERVATION_USD_MICROS:-0}
      MEU_BRACO_DIREITO_VISUAL_AI_MONTHLY_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_MONTHLY_BUDGET_USD_MICROS:-0}
      MEU_BRACO_DIREITO_VISUAL_AI_GLOBAL_MONTHLY_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_GLOBAL_MONTHLY_BUDGET_USD_MICROS:-0}
      MEU_BRACO_DIREITO_META_ACCESS_TOKEN: ${MEU_BRACO_DIREITO_META_ACCESS_TOKEN:-}
      MEU_BRACO_DIREITO_META_GRAPH_VERSION: ${MEU_BRACO_DIREITO_META_GRAPH_VERSION:-}
      MEU_BRACO_DIREITO_META_PHONE_NUMBER_ID: ${MEU_BRACO_DIREITO_META_PHONE_NUMBER_ID:-}
      MEU_BRACO_DIREITO_META_REPLY_ENABLED: ${MEU_BRACO_DIREITO_META_REPLY_ENABLED:-false}
      MEU_BRACO_DIREITO_META_DAILY_MESSAGE_LIMIT: ${MEU_BRACO_DIREITO_META_DAILY_MESSAGE_LIMIT:-0}
      MEU_BRACO_DIREITO_TEMPORAL_ADDRESS: temporal:7233
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_BUCKET: meu-braco-direito-materials
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_ENDPOINT: http://object-storage:8333
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_ACCESS_KEY: meu-braco-direito-local
      MEU_BRACO_DIREITO_MATERIAL_STORAGE_SECRET_KEY: meu-braco-direito-local-secret
    profiles: ["workers"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      object-storage:
        condition: service_started
  relay:
    # Manual compatibility consumer for receipts persisted before P14.
    build: .
    command: ["python", "-m", "app.entrypoints.relay"]
    environment:
      MEU_BRACO_DIREITO_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_runtime:meu-braco-direito-app-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_RELAY_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_delivery:meu-braco-direito-relay-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_JWT_SECRET: development-meu-braco-direito-change-this-secret-before-deploying
      MEU_BRACO_DIREITO_TEMPORAL_ADDRESS: temporal:7233
    profiles: ["legacy-relay"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
  billing:
    build: .
    command: ["python", "-m", "app.entrypoints.billing"]
    environment:
      MEU_BRACO_DIREITO_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_payments:meu-braco-direito-billing-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_BILLING_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_payments:meu-braco-direito-billing-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_JWT_SECRET: development-meu-braco-direito-change-this-secret-before-deploying
      MEU_BRACO_DIREITO_TEMPORAL_ADDRESS: temporal:7233
      MEU_BRACO_DIREITO_BILLING_MODE: ${MEU_BRACO_DIREITO_BILLING_MODE:-disabled}
      MEU_BRACO_DIREITO_PUBLIC_WEB_URL: ${MEU_BRACO_DIREITO_PUBLIC_WEB_URL:-http://localhost:5173}
      MEU_BRACO_DIREITO_STRIPE_SECRET_KEY: ${MEU_BRACO_DIREITO_STRIPE_SECRET_KEY:-}
      MEU_BRACO_DIREITO_STRIPE_WEBHOOK_SECRET: ${MEU_BRACO_DIREITO_STRIPE_WEBHOOK_SECRET:-}
      MEU_BRACO_DIREITO_STRIPE_PRICE_ID: ${MEU_BRACO_DIREITO_STRIPE_PRICE_ID:-}
      MEU_BRACO_DIREITO_BILLING_MONTHLY_AMOUNT_MINOR: ${MEU_BRACO_DIREITO_BILLING_MONTHLY_AMOUNT_MINOR:-}
    profiles: ["workers"]
    restart: on-failure
    depends_on: [postgres, temporal]
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:11025:1025"]
  auth-mail:
    build: .
    command: ["python", "-m", "app.entrypoints.auth_mail"]
    environment:
      MEU_BRACO_DIREITO_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_identity:meu-braco-direito-auth-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_AUTH_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_identity:meu-braco-direito-auth-password@postgres:5432/meu_braco_direito_platform
      MEU_BRACO_DIREITO_JWT_SECRET: development-meu-braco-direito-change-this-secret-before-deploying
      MEU_BRACO_DIREITO_SMTP_HOST: mailpit
      MEU_BRACO_DIREITO_SMTP_PORT: 1025
    profiles: ["workers"]
    restart: on-failure
    depends_on: [postgres, mailpit]

volumes:
  meu-braco-direito-postgres:
  meu-braco-direito-temporal:
  meu-braco-direito-materials:
