name: CI
on:
  pull_request:
  push:
    branches: [main, develop, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: local-spark-test-admin-password
          POSTGRES_DB: local_spark_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d local_spark_platform_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      LOCAL_SPARK_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:local-spark-test-admin-password@127.0.0.1:5432/local_spark_platform_test
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:local-spark-test-admin-password@127.0.0.1:5432/local_spark_platform_test
      TEST_DATABASE_URL: postgresql+asyncpg://local_spark_runtime:local-spark-app-password@127.0.0.1:5432/local_spark_platform_test
      TEST_AUTH_DATABASE_URL: postgresql+asyncpg://local_spark_identity:local-spark-auth-password@127.0.0.1:5432/local_spark_platform_test
      TEST_BILLING_DATABASE_URL: postgresql+asyncpg://local_spark_payments:local-spark-billing-password@127.0.0.1:5432/local_spark_platform_test
      TEST_RELAY_DATABASE_URL: postgresql+asyncpg://local_spark_delivery:local-spark-relay-password@127.0.0.1:5432/local_spark_platform_test
      TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.6"
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint types
      - name: Migrate isolated test database and create restricted logins
        run: |
          uv run alembic upgrade head
          uv run python scripts/prepare_local_tests.py
      - name: Start Temporal development service
        run: docker run -d --name local-spark-temporal-test -p 127.0.0.1:7233:7233 temporalio/temporal:1.4.1 server start-dev --ip 0.0.0.0
      - name: Wait for Temporal
        run: uv run python scripts/wait_temporal.py
      - name: Unit, PostgreSQL and real Temporal integration tests; 100% line and branch coverage
        run: make test
      - name: Verify migration rollback and reapply
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Build runtime image
        run: docker build -t local-spark-platform:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
