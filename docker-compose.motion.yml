# Optional overlay for the existing API -> outbox relay -> Temporal worker path.
# Does not enable motion or a paid provider by itself. See docker/motion-worker/README.md.
x-motion-environment: &motion-environment
  MEU_BRACO_DIREITO_ENVIRONMENT: ${MEU_BRACO_DIREITO_ENVIRONMENT:-development}
  MEU_BRACO_DIREITO_MOTION_EXECUTION_ENABLED: ${MEU_BRACO_DIREITO_MOTION_EXECUTION_ENABLED:-false}
  MEU_BRACO_DIREITO_MOTION_AI_MODE: ${MEU_BRACO_DIREITO_MOTION_AI_MODE:-disabled}
  MEU_BRACO_DIREITO_MOTION_LOCAL_QUALIFICATION_BUSINESS_ID: ${MEU_BRACO_DIREITO_MOTION_LOCAL_QUALIFICATION_BUSINESS_ID:-}
  MEU_BRACO_DIREITO_MOTION_LOCAL_QUALIFICATION_ASSET_IDS: ${MEU_BRACO_DIREITO_MOTION_LOCAL_QUALIFICATION_ASSET_IDS:-[]}
  MEU_BRACO_DIREITO_MOTION_AI_MODEL: ${MEU_BRACO_DIREITO_MOTION_AI_MODEL:-}
  MEU_BRACO_DIREITO_MOTION_AI_MAX_OUTPUT_TOKENS: ${MEU_BRACO_DIREITO_MOTION_AI_MAX_OUTPUT_TOKENS:-16000}
  MEU_BRACO_DIREITO_MOTION_AI_INPUT_USD_MICROS_PER_MILLION_TOKENS: ${MEU_BRACO_DIREITO_MOTION_AI_INPUT_USD_MICROS_PER_MILLION_TOKENS:-0}
  MEU_BRACO_DIREITO_MOTION_AI_OUTPUT_USD_MICROS_PER_MILLION_TOKENS: ${MEU_BRACO_DIREITO_MOTION_AI_OUTPUT_USD_MICROS_PER_MILLION_TOKENS:-0}
  MEU_BRACO_DIREITO_MOTION_AI_RESERVATION_USD_MICROS: ${MEU_BRACO_DIREITO_MOTION_AI_RESERVATION_USD_MICROS:-0}
  MEU_BRACO_DIREITO_MOTION_REQUEST_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_MOTION_REQUEST_BUDGET_USD_MICROS:-0}
  MEU_BRACO_DIREITO_MOTION_STORYBOARD_ENABLED: ${MEU_BRACO_DIREITO_MOTION_STORYBOARD_ENABLED:-false}
  MEU_BRACO_DIREITO_MOTION_ILLUSTRATIONS_ENABLED: ${MEU_BRACO_DIREITO_MOTION_ILLUSTRATIONS_ENABLED:-false}
  MEU_BRACO_DIREITO_MOTION_ILLUSTRATION_RESERVATION_USD_MICROS: ${MEU_BRACO_DIREITO_MOTION_ILLUSTRATION_RESERVATION_USD_MICROS:-0}
  MEU_BRACO_DIREITO_MOTION_ILLUSTRATION_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_MOTION_ILLUSTRATION_BUDGET_USD_MICROS:-0}
  MEU_BRACO_DIREITO_MOTION_MAX_CORRECTIONS: ${MEU_BRACO_DIREITO_MOTION_MAX_CORRECTIONS:-1}
  MEU_BRACO_DIREITO_MOTION_RENDERER_IMAGE: ${MEU_BRACO_DIREITO_MOTION_RENDERER_IMAGE:?Set the locally loaded renderer image digest}
  MEU_BRACO_DIREITO_MOTION_RENDERER_DOCKER_EXECUTABLE: /usr/local/bin/docker
  MEU_BRACO_DIREITO_MOTION_RENDERER_DOCKER_SOCKET: /run/motion-docker.sock
  MEU_BRACO_DIREITO_MOTION_RENDERER_SCRATCH_DIRECTORY: ${MOTION_SCRATCH_DIRECTORY:?Set an existing absolute shared directory}
  MEU_BRACO_DIREITO_META_ENCRYPTION_KEY: ${MEU_BRACO_DIREITO_META_ENCRYPTION_KEY:-}
  MEU_BRACO_DIREITO_OPENAI_API_KEY: ${MEU_BRACO_DIREITO_OPENAI_API_KEY:-}
  MEU_BRACO_DIREITO_VISUAL_AI_MONTHLY_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_MONTHLY_BUDGET_USD_MICROS:-0}
  MEU_BRACO_DIREITO_VISUAL_AI_GLOBAL_MONTHLY_BUDGET_USD_MICROS: ${MEU_BRACO_DIREITO_VISUAL_AI_GLOBAL_MONTHLY_BUDGET_USD_MICROS:-0}
  MEU_BRACO_DIREITO_MATERIAL_STORAGE_BUCKET: meu-braco-direito-materials
  MEU_BRACO_DIREITO_CORRELATOR_DATABASE_URL: postgresql+asyncpg://meu_braco_direito_router:meu-braco-direito-router-password@postgres:5432/meu_braco_direito_platform
  MEU_BRACO_DIREITO_TEMPORAL_TASK_QUEUE: ${MEU_BRACO_DIREITO_TEMPORAL_TASK_QUEUE:-meu-braco-direito-foundation}

services:
  api:
    environment:
      <<: *motion-environment
  relay:
    # Existing outbox dispatcher also owns motion.requested; not a second runner.
    profiles: [workers]
    environment:
      <<: *motion-environment
  worker:
    build:
      target: motion-worker
    user: "${MOTION_WORKER_UID:-10001}:${MOTION_WORKER_GID:-10001}"
    group_add:
      - "${MOTION_DOCKER_GID:?Set the group allowed to access the mounted Docker socket}"
    environment:
      <<: *motion-environment
    volumes:
      - type: bind
        source: ${MOTION_DOCKER_SOCKET:?Set the existing local Docker socket path}
        target: /run/motion-docker.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MOTION_SCRATCH_DIRECTORY:?Set an existing absolute shared directory}
        target: ${MOTION_SCRATCH_DIRECTORY:?Set an existing absolute shared directory}
        bind:
          create_host_path: false
